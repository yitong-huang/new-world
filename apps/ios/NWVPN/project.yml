name: NWVPNiOS
schemes:
  NWVPNiOS:
    build:
      targets:
        NWVPNiOS: all
options:
  bundleIdPrefix: com.newworld
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:
  NWVPNiOS:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          # 避免 .entitlements 进资源/编译阶段与 CODE_SIGN_ENTITLEMENTS 重复处理 → “modified during the build”
          - "**/*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.newworld.NWVPNiOS
        CODE_SIGN_ENTITLEMENTS: App/NWVPN.entitlements
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: NewWorld VPN
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIRequiresFullScreen: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
    postBuildScripts:
      - name: Embed configs servers list
        script: |
          set -e
          SRC="${SRCROOT}/../../../configs/servers"
          APP="${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}"
          mkdir -p "${APP}"
          if [[ -f "$SRC" ]]; then
            cp -f "$SRC" "${APP}/servers"
          fi
        basedOnDependencyAnalysis: false
    dependencies:
      - target: NWVPNiOSPacketTunnel
        embed: true

  NWVPNiOSPacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension
        excludes:
          - "**/*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.newworld.NWVPNiOS.PacketTunnel
        CODE_SIGN_ENTITLEMENTS: Extension/PacketTunnel.entitlements
        INFOPLIST_FILE: Extension/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
